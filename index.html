<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Higen Sales Bible</title>
<style>
  :root{--navy:#0b2545;--teal:#0f7d84;--teal-light:#e6f4f4;
        --bg:#f5f7f8;--text:#1c2b36;--muted:#5c6b73;--line:#9cc4c6;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);
       display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{width:100%;max-width:360px;background:#fff;border:1.5px solid var(--line);
        border-radius:16px;padding:34px 30px 28px;box-shadow:0 2px 16px rgba(11,37,69,.08);}
  .brand{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--teal);
         font-weight:700;text-align:center;}
  h1{font-family:Cambria,Georgia,serif;font-size:21px;color:var(--navy);text-align:center;margin:6px 0 4px;}
  .sub{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:26px;}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--navy);margin:0 0 5px;letter-spacing:.3px;}
  input{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1.5px solid #d7e0e3;
        border-radius:9px;background:#fff;color:var(--text);margin-bottom:16px;outline:none;}
  input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light);}
  button{width:100%;font-family:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--navy);
         border:none;border-radius:9px;padding:11px;cursor:pointer;margin-top:4px;transition:background .15s;}
  button:hover:not(:disabled){background:var(--teal);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{font-size:12.5px;text-align:center;margin-top:14px;min-height:17px;}
  .msg.err{color:#c0392b;}
  .foot{font-size:10.5px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.5;}
</style>
</head>
<body>

<form class="card" id="form" autocomplete="on">
  <div class="brand">Higen Pharma · Commercial Excellence &amp; Marketing</div>
  <h1>The Sales Bible</h1>
  <div class="sub">Sign in to continue</div>

  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username"
         autocapitalize="none" spellcheck="false" required>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button id="btn" type="submit">Sign in</button>
  <div class="msg" id="msg"></div>

  <div class="foot">Author: Mustafa Al-Hashimi · V0.24 Draft</div>
</form>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://dbdbmbtveftcxcnmqobs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6dyU6Fhprno1_pUZRdVqKQ_yXEbFNma';
const APP_PAGE     = 'Higen_Sales_Bible_App_V0.24.html'; // Or 'bible.html' if you rename the app file

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const form      = document.getElementById('form');
const userInput = document.getElementById('username');
const passInput = document.getElementById('password');
const btn       = document.getElementById('btn');
const msg       = document.getElementById('msg');

const setMsg = (t) => { msg.textContent = t || ''; msg.className = 'msg' + (t ? ' err' : ''); };

// Already signed in in this tab -> skip straight through
if (sessionStorage.getItem('sb_user')) location.replace(APP_PAGE);

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = userInput.value.trim();
  const password = passInput.value;

  if (!username || !password) { setMsg('Enter your username and password.'); return; }

  setMsg('');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const { data, error } = await supabase.rpc('verify_sales_bible_login', {
      p_username: username,
      p_password: password
    });

    if (error) throw error;

    const user = Array.isArray(data) ? data[0] : data;

    if (!user) {
      setMsg('Invalid username or password.');
      btn.disabled = false;
      btn.textContent = 'Sign in';
      passInput.value = '';
      passInput.focus();
      return;
    }

    sessionStorage.setItem('sb_user', JSON.stringify(user));
    location.replace(APP_PAGE);

  } catch (err) {
    console.error(err);
    setMsg('Sign-in failed. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
